[project]
name = "timber"
version = "0.1.0"
description = "TimeTree の指定日の予定を取得・読み上げ音声にするコマンドラインツール"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=2.25.0",
    "python-dateutil>=2.9",
    "requests>=2.32",
]

[project.scripts]
timetree = "timetree:main"
timetree-tts = "timetree_tts:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["timetree.py", "timetree_tts.py"]
