[project]
name = "timber"
version = "0.1.0"
description = "TimeTree の指定日の予定を取得するコマンドラインツール"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "python-dateutil>=2.9",
    "requests>=2.32",
]

[project.scripts]
timetree = "timetree:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["timetree.py"]
